<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aledaño</title>
  <meta name="description" content="Aledaño, un juego nuevo. Próximamente.">
  <style>
    :root {
      --bg: #f6f3ee;
      --fg: #1f1d1a;
      --muted: #6b665e;
      --accent: #b4552d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --fg: #eeeae3;
        --muted: #a29c92;
        --accent: #e0825a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Aleda<span>ñ</span>o</h1>
    <p>Próximamente.</p>
  </main>
</body>
</html>
